name: Daily forecast

on:
  schedule:
    - cron: "17 13 * * *"     # 13:17 UTC = 6:17 am Pacific (5:17 am after daylight saving ends)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch, forecast, rebuild page
        env:
          FORECAST_UA: "ElectionForecast2026/1.0 (${{ github.server_url }}/${{ github.repository }})"
        run: make daily
      - name: Notebook reports
        run: make reports
      - name: Save the day's data and outputs
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add data site
          git commit -m "Forecast $(cat data/raw/LATEST)" || echo "nothing to commit"
          git push
      - name: Copy reports into the site
        run: mkdir -p site/reports && cp reports/*.html site/reports/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: forecast
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
